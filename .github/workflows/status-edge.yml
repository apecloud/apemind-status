name: Status Edge CI

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/status-edge.yml"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
  push:
    branches: [master]
    paths:
      - ".github/workflows/status-edge.yml"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-status-edge
  cancel-in-progress: true

jobs:
  pr-worker-contract:
    name: PR Worker contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Worker tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run check:deploy

  trusted-worker-contract:
    name: Trusted Worker contract
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Worker tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run check:deploy
