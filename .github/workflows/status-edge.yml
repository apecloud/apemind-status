name: Status Edge CI

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/status-edge.yml"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
  push:
    branches: [master]
    paths:
      - ".github/workflows/status-edge.yml"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-status-edge
  cancel-in-progress: true

jobs:
  worker-contract:
    name: Worker contract
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Worker tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run check:deploy
